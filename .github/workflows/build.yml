name: Build Routing

on:
  push:
    branches:
      - main
    paths:
      - "config/routing-template.json"
      - "scripts/build_routing.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: routing-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate release tag
        id: release
        run: |
          set -e
          TAG="$(date -u +'%Y%m%d%H%M%S')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Sync main
        run: |
          set -e
          git fetch origin main
          git checkout main
          git rebase origin/main

      - name: Build HAPP and INCY
        run: |
          set -e

          python scripts/build_routing.py \
            --repo "prorocksvp/prorocks" \
            --tag "${{ steps.release.outputs.tag }}"

      - name: Verify generated files
        run: |
          set -e

          test -f HAPP/ROUTING.JSON
          test -f HAPP/ROUTING.DEEPLINK
          test -f HAPP/ROUTING.ONADD.DEEPLINK

          test -f INCY/ROUTING.JSON
          test -f INCY/ROUTING.ONADD.DEEPLINK

          python -m json.tool HAPP/ROUTING.JSON > /dev/null
          python -m json.tool INCY/ROUTING.JSON > /dev/null

          echo "All generated files are valid."

      - name: Verify HAPP and INCY
        run: |
          set -e

          python - <<'PY'
          import json
          import sys

          with open("HAPP/ROUTING.JSON", encoding="utf-8") as f:
              happ = json.load(f)

          with open("INCY/ROUTING.JSON", encoding="utf-8") as f:
              incy = json.load(f)

          fields = [
              "Name",
              "GlobalProxy",
              "UseChunkFiles",
              "RemoteDns",
              "DomesticDns",
              "RemoteDNSType",
              "RemoteDNSDomain",
              "RemoteDNSIP",
              "DomesticDNSType",
              "DomesticDNSDomain",
              "DomesticDNSIP",
              "Geositeurl",
              "Geoipurl",
              "DnsHosts",
              "RouteOrder",
              "DirectSites",
              "DirectIp",
              "ProxySites",
              "ProxyIp",
              "BlockSites",
              "BlockIp",
              "DomainStrategy",
              "FakeDNS",
          ]

          for field in fields:
              if happ.get(field) != incy.get(field):
                  print(f"ERROR: HAPP and INCY differ in {field}")
                  sys.exit(1)

          print("HAPP and INCY are synchronized.")
          PY

      - name: Commit and push
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add HAPP/ INCY/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "build: ${{ steps.release.outputs.tag }}"

          git tag "${{ steps.release.outputs.tag }}"

          # Get any commits that appeared on main while this
          # workflow was running.
          git fetch origin main

          # Put our generated commit on top of the latest main.
          git rebase origin/main

          # Push the rebased commit and tag.
          git push origin HEAD:main --follow-tags
